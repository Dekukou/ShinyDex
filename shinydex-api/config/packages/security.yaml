security:
    password_hashers:
        App\Entity\User\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                username_parameter: username
                password_parameter: password
            logout:
                path: logout

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
